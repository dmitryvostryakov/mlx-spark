name: scaffold-only
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,reference]'
      - run: bash scripts/check_local.sh
# TEMPLATE status: actions and dependencies must be locked to reviewed full hashes
# before production CI. Never attach the private Spark runner to fork PRs.
